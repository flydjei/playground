<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDC Atlas — IDC 랙 · IP · 장비 통합 관리</title>
<meta name="description" content="오픈소스 RackManager 1.2.5 기능 명세를 기반으로 IP 주소 관리(IPAM)·장비 라이프사이클·전력·변경 이력까지 확장한 IDC 자원 관리 프로토타입">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
  /* 첫 페인트 전에 테마를 정해 깜빡임을 막는다 — 저장값이 없으면 시스템 설정을 따른다 (나머지 처리는 app.js) */
  (function () {
    var t = null;
    try { t = localStorage.getItem('idc-atlas-theme') || localStorage.getItem('rm-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<!-- 캐시 버스팅: style.css/data.js/app.js를 수정할 때마다 아래 ?v= 값을 올려주세요 -->
<link rel="stylesheet" href="./assets/style.css?v=9">
</head>
<body>

<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<div class="shell">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="2.5" width="16" height="19" rx="2.5"/>
          <path d="M7.5 7h9M7.5 12h9M7.5 17h5"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>IDC Atlas</strong>
        <small>IDC 랙 · IP · 장비 관리</small>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="주요 메뉴">
      <a class="nav-item" href="#/dashboard"      data-match="dashboard">
        <span class="ni" aria-hidden="true">🏠</span> 대시보드 <span class="nav-count" data-count="alerts" title="점검 필요 항목"></span></a>
      <a class="nav-item" href="#/devices"        data-match="devices,device">
        <span class="ni" aria-hidden="true">🖥️</span> 장비 <span class="nav-count" data-count="devices"></span></a>
      <a class="nav-item" href="#/racks"          data-match="racks,rack">
        <span class="ni" aria-hidden="true">🗄️</span> 랙 <span class="nav-count" data-count="racks"></span></a>
      <a class="nav-item" href="#/physical"       data-match="physical">
        <span class="ni" aria-hidden="true">📐</span> 랙 실장도</a>
      <a class="nav-item" href="#/ipam"           data-match="ipam,subnet">
        <span class="ni" aria-hidden="true">🌐</span> IP 관리 <span class="nav-count" data-count="subnets"></span></a>
      <a class="nav-item" href="#/apps"           data-match="apps,app">
        <span class="ni" aria-hidden="true">🧩</span> 앱 <span class="nav-count" data-count="apps"></span></a>
      <a class="nav-item" href="#/reports"        data-match="reports">
        <span class="ni" aria-hidden="true">📊</span> 리포트</a>
      <a class="nav-item" href="#/activity"       data-match="activity">
        <span class="ni" aria-hidden="true">🕘</span> 활동 로그</a>
      <a class="nav-item" href="#/config"         data-match="config">
        <span class="ni" aria-hidden="true">⚙️</span> 설정</a>
    </nav>

    <div class="sidebar-foot">
      <a class="nav-item subtle" href="#/system"  data-match="system">
        <span class="ni" aria-hidden="true">ℹ️</span> 시스템 정보</a>
      <label class="ro-toggle" title="읽기 전용 모드에서는 추가·수정·삭제가 비활성화됩니다">
        <input type="checkbox" id="readonly-toggle"> <span>읽기 전용 모드</span>
      </label>
    </div>
  </aside>

  <!-- ===== Topbar ===== -->
  <header class="topbar">
    <button type="button" class="icon-btn only-mobile" id="menu-btn" aria-label="메뉴" aria-expanded="false" aria-controls="sidebar">☰</button>

    <form class="search" id="search-form" role="search">
      <span class="search-ico" aria-hidden="true">🔎</span>
      <input type="search" id="search-input" placeholder="장비명 · 시리얼 · 자산번호 · IP · 서브넷 검색 (예: web, 10.11.0.)" autocomplete="off" aria-label="통합 검색">
      <kbd aria-hidden="true">/</kbd>
    </form>

    <div class="topbar-right">
      <button type="button" class="icon-btn" id="print-btn" title="현재 화면 인쇄" aria-label="현재 화면 인쇄">🖨️</button>
      <button type="button" class="icon-btn" id="theme-btn" title="테마 전환" aria-label="어두운 테마로 전환">🌗</button>
      <div class="who" title="접속 계정">
        <span class="avatar">R</span>
        <span class="who-text"><strong>atlas-admin</strong><small>10.20.30.41</small></span>
      </div>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="main" id="main" tabindex="-1"></main>

  <footer class="appfoot">
    <span>접속: <b id="foot-user">atlas-admin</b> @ <b>10.20.30.41</b></span>
    <span class="dot">·</span>
    <span>IDC Atlas <b id="foot-version">2.0.0</b> prototype</span>
    <span class="dot">·</span>
    <span><b id="foot-saved">—</b></span>
    <span class="dot">·</span>
    <span>페이지 생성 <b id="foot-time">—</b></span>
    <span class="dot">·</span>
    <span class="foot-note">프로토타입 — 변경 내용은 이 브라우저(localStorage)에 자동 저장됩니다. 시스템 정보에서 백업·초기화할 수 있습니다.</span>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<dialog id="modal" class="modal" closedby="any" aria-labelledby="modal-title"></dialog>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="./assets/ipam-core.js?v=9"></script>
<script src="./assets/data.js?v=9"></script>
<script src="./assets/app.js?v=9"></script>
</body>
</html>
