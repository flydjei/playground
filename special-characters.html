<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {

    margin: 0;
    padding: 24px;

  }
  .desc {

    color: #555;
    margin: 0 0 16px;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 0;
    margin-bottom: 8px;
    background: #f4f5f7;
  }
  .toolbar a {
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;

  .toolbar a:hover { background: #4a7dfc; border-color: #4a7dfc; color: #fff; }
  .column {
    background: #ffffff;
    border: 1px solid #d9dbe0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    scroll-margin-top: calc(var(--toolbar-h, 56px) + 8px);
  }
  .column h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 16px;
    margin: 0 0 10px;
    color: #444;
    font-weight: 600;
  }
  .column h2 .count {
    margin-left: auto;
    font-size: 12px;
    font-weight: 400;
    color: #888;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
    border-top: 1px solid #e3e5e9;
    border-left: 1px solid #e3e5e9;
  }
  .cell {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    font-family: "Malgun Gothic", "Segoe UI Symbol", "Segoe UI", sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: inherit;
    background: transparent;
    border: none;
    border-right: 1px solid #e3e5e9;
    border-bottom: 1px solid #e3e5e9;
    border-radius: 0;
    cursor: pointer;
  }
  .cell:hover { background: #eaf0ff; }
  .cell:focus-visible { outline: 2px solid #4a7dfc; outline-offset: -2px; }
  .cell.label { font-size: 11px; color: #888; }
  .cell.copied { background: #2ecc71; color: #fff; }
  #status {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 10px 16px;
    font-size: 13px;
    color: #fff;
    background: #1c1c1e;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  #status.show { opacity: .92; }
  #tooltip {
    position: fixed;
    z-index: 10;
    max-width: 240px;
    padding: 5px 8px;
    font-size: 12px;
    line-height: 1.4;
    color: #fff;
    background: #1c1c1e;
    border-radius: 4px;
    pointer-events: none;
    white-space: nowrap;
  }
  #tooltip[hidden] { display: none; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .toolbar { flex-wrap: nowrap; overflow-x: auto; }
    .toolbar a { flex: none; white-space: nowrap; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
    .cell { font-size: 18px; }
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1e1f22; color: #e6e6e6; }
    .desc { color: #aaa; }
    .toolbar { background: #1e1f22; }
    .toolbar a { background: #2a2b2e; border-color: #3a3b3e; }

    .column h2 { color: #bbb; }
    .grid, .cell { border-color: #3a3b3e; }
    .cell:hover { background: #33405e; }
    #status, #tooltip { background: #e6e6e6; color: #1c1c1e; }

<p class="desc">Windows 한국어 입력기에서 자음을 입력하고 <b>한자</b> 키를 누르면 나오는 특수문자 전체 목록입니다. 칸을 클릭하면 복사됩니다.</p>

<nav class="toolbar" id="toolbar" aria-label="자음 바로가기"></nav>
<div id="groups"></div>
<div id="status" role="status" aria-live="polite"></div>

<script>
// 코드 포인트 구간 [시작, 끝]을 문자 배열로 펼침
function range(...pairs) {
  const out = [];
  for (const [from, to] of pairs) {
    for (let cp = from; cp <= to; cp++) out.push(String.fromCodePoint(cp));
  }
  return out;
}

// 공백으로 구분된 문자 목록을 배열로 변환
const list = str => str.trim().split(/\s+/);

const SOFT_HYPHEN = '­';

// Windows IME(KS X 1001 기반) 자음별 특수문자 순서

// 화면에 보이지 않는 문자는 이름으로 표시
const LABELS = { [SOFT_HYPHEN]: 'SHY' };

// 문자별 명칭: 한 줄에 "문자 한글명|영문명" (한쪽이 없으면 비워 둠)
function parseNames(text) {
  const out = {};
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    const ch = String.fromCodePoint(t.codePointAt(0));
    const [ko = '', en = ''] = t.slice(ch.length).split('|').map(s => s.trim());
    out[ch] = { ko, en };
  }
  return out;
}

NAMES[SOFT_HYPHEN] = { ko: '소프트 하이픈', en: 'Soft Hyphen' };

// 한글 호환 자모(U+3131~U+3163) 명칭
list(
  '기역 쌍기역 기역시옷 니은 니은지읒 니은히읗 디귿 쌍디귿 리을 리을기역 리을미음 리을비읍 리을시옷 리을티읕 리을피읖 리을히읗 ' +
  '미음 비읍 쌍비읍 비읍시옷 시옷 쌍시옷 이응 지읒 쌍지읒 치읓 키읔 티읕 피읖 히읗 ' +
  '아 애 야 얘 어 에 여 예 오 와 왜 외 요 우 워 웨 위 유 으 의 이'
).forEach((ko, i) => { NAMES[String.fromCodePoint(0x3131 + i)] = { ko, en: '' }; });

// 그리스 문자 명칭 (U+03A2는 비어 있는 코드 포인트라 대문자에서 제외)
[
  ['알파', 'Alpha'], ['베타', 'Beta'], ['감마', 'Gamma'], ['델타', 'Delta'], ['엡실론', 'Epsilon'], ['제타', 'Zeta'],
  ['에타', 'Eta'], ['세타', 'Theta'], ['이오타', 'Iota'], ['카파', 'Kappa'], ['람다', 'Lambda'], ['뮤', 'Mu'],
  ['뉴', 'Nu'], ['크시', 'Xi'], ['오미크론', 'Omicron'], ['파이', 'Pi'], ['로', 'Rho'], ['시그마', 'Sigma'],
  ['타우', 'Tau'], ['입실론', 'Upsilon'], ['피', 'Phi'], ['카이', 'Chi'], ['프사이', 'Psi'], ['오메가', 'Omega']
].forEach(([ko, en], i) => {
  const offset = i >= 17 ? i + 1 : i;
  NAMES[String.fromCodePoint(0x0391 + offset)] = { ko: '대문자 ' + ko, en: 'Capital ' + en };
  NAMES[String.fromCodePoint(0x03B1 + offset)] = { ko: '소문자 ' + ko, en: 'Small ' + en };
});

// 한글·영문 명칭 조합: 둘 다 있으면 "한글 (영문)", 하나만 있으면 그것만, 둘 다 없으면 빈 문자열
function tooltipOf(ch) {
  const { ko = '', en = '' } = NAMES[ch] || {};
  if (ko && en) return `${ko} (${en})`;
  return ko || en;
}

const toolbarEl = document.getElementById('toolbar');
const groupsEl = document.getElementById('groups');
const statusEl = document.getElementById('status');
const tooltipEl = document.getElementById('tooltip');

const codeOf = ch => 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');

for (const group of GROUPS) {
  const id = 'g-' + group.key;

  const link = document.createElement('a');
  link.href = '#' + id;
  link.textContent = group.name;
  link.title = group.key + ' + 한자';
  toolbarEl.appendChild(link);

  const section = document.createElement('section');
  section.className = 'column';
  section.id = id;

  const h2 = document.createElement('h2');
  h2.innerHTML = `<span class="name"></span><span class="count"></span>`;
  h2.querySelector('.name').textContent = group.name;
  h2.querySelector('.count').textContent = `${group.chars.length}자`;
  section.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const ch of group.chars) {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.dataset.char = ch;
    const tip = tooltipOf(ch);
    if (tip) cell.dataset.tip = tip;
    if (LABELS[ch]) {
      cell.classList.add('label');
      cell.textContent = LABELS[ch];
    } else {
      cell.textContent = ch;
    }
    grid.appendChild(cell);
  }
  section.appendChild(grid);
  groupsEl.appendChild(section);
}

// 바로가기 메뉴가 여러 줄로 감겨도 섹션 제목이 메뉴에 가려지지 않도록 높이를 반영
function syncToolbarHeight() {
  document.documentElement.style.setProperty('--toolbar-h', toolbarEl.offsetHeight + 'px');
}
syncToolbarHeight();
window.addEventListener('resize', syncToolbarHeight);

// 브라우저 기본 title 툴팁은 지연이 있어 직접 그린 툴팁을 즉시 표시
function showTooltip(cell) {
  tooltipEl.textContent = cell.dataset.tip;
  tooltipEl.hidden = false;
  const rect = cell.getBoundingClientRect();
  const tipRect = tooltipEl.getBoundingClientRect();
  const margin = 6;
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));
  let top = rect.top - tipRect.height - margin;
  if (top < margin) top = rect.bottom + margin;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function hideTooltip() {
  tooltipEl.hidden = true;
}

groupsEl.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('.cell');
  if (cell && cell.dataset.tip) showTooltip(cell);
  else hideTooltip();
});
groupsEl.addEventListener('mouseleave', hideTooltip);
groupsEl.addEventListener('focusin', (e) => {
  const cell = e.target.closest('.cell');
  if (cell && cell.dataset.tip) showTooltip(cell);
  else hideTooltip();
});
groupsEl.addEventListener('focusout', hideTooltip);
window.addEventListener('scroll', hideTooltip, { passive: true });

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const temp = document.createElement('textarea');
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
  }
}

let statusTimer;
groupsEl.addEventListener('click', async (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;

  const ch = cell.dataset.char;
  await copyText(ch);

  cell.classList.add('copied');
  setTimeout(() => cell.classList.remove('copied'), 600);

  statusEl.textContent = `복사됨: ${LABELS[ch] || ch} (${codeOf(ch)})`;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.remove('show'), 1200);
});
</script>
