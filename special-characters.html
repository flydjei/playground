<script>
// 코드 포인트 구간 [시작, 끝]을 문자 배열로 펼침
function range(...pairs) {
  const out = [];
  for (const [from, to] of pairs) {
    for (let cp = from; cp <= to; cp++) out.push(String.fromCodePoint(cp));
  }
  return out;
}

// 공백으로 구분된 문자 목록을 배열로 변환
const list = str => str.trim().split(/\s+/);

const SOFT_HYPHEN = '\u00AD';

// Windows IME(KS X 1001 기반) 자음별 특수문자 순서
// 단위의 옹스트롬(U+212B)·옴(U+2126)은 정규화(NFC)되면 Å(U+00C5)·Ω(U+03A9)로 바뀌므로 이스케이프로 적음
const GROUPS = [

  )},
  { key: 'ㅁ', name: '도형 · 기타 기호', chars: list(
    '＃ ＆ ＊ ＠ § ※ ☆ ★ ○ ● ◎ ◇ ◆ □ ■ △ ▲ ▽ ▼ → ← ↑ ↓ ↔ 〓 ' +

// 화면에 보이지 않는 문자는 이름으로 표시
const LABELS = { [SOFT_HYPHEN]: 'SHY' };

// 문자별 명칭(규칙적인 문자는 아래에서 계산): 한 줄에 "문자 한글명|영문명" (한쪽이 없으면 비워 둠)
function parseNames(text) {
  const out = {};
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    const ch = String.fromCodePoint(t.codePointAt(0));
    const [ko = '', en = ''] = t.slice(ch.length).split('|').map(s => s.trim());
    out[ch] = { ko, en };
  }
  return out;
}

function setNames(chars, nameAt) {

const NUMBER_WORDS = list('Zero One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen');
const LATIN_UPPER = range([0x41, 0x5A]);

// 그리스 문자 (U+03A2, U+03C2는 표에 없어 건너뜀)
const GREEK = [
  ['알파', 'Alpha'], ['베타', 'Beta'], ['감마', 'Gamma'], ['델타', 'Delta'], ['엡실론', 'Epsilon'], ['제타', 'Zeta'],
  ['에타', 'Eta'], ['세타', 'Theta'], ['이오타', 'Iota'], ['카파', 'Kappa'], ['람다', 'Lambda'], ['뮤', 'Mu'],
  ['뉴', 'Nu'], ['크시', 'Xi'], ['오미크론', 'Omicron'], ['파이', 'Pi'], ['로', 'Rho'], ['시그마', 'Sigma'],
  ['타우', 'Tau'], ['입실론', 'Upsilon'], ['피', 'Phi'], ['카이', 'Chi'], ['프사이', 'Psi'], ['오메가', 'Omega']
];
setNames(range([0x0391, 0x03A1], [0x03A3, 0x03A9]), i => ({ ko: '대문자 ' + GREEK[i][0], en: 'Greek Capital Letter ' + GREEK[i][1] }));
setNames(range([0x03B1, 0x03C1], [0x03C3, 0x03C9]), i => ({ ko: '소문자 ' + GREEK[i][0], en: 'Greek Small Letter ' + GREEK[i][1] }));

// 한글 원 문자 · 괄호 문자: 자음 14자 뒤에 '가'~'하' 14자가 이어짐
const HANGUL_KO = list('기역 니은 디귿 리을 미음 비읍 시옷 이응 지읒 치읓 키읔 티읕 피읖 히읗 가 나 다 라 마 바 사 아 자 차 카 타 파 하');
const HANGUL_EN = list('Kiyeok Nieun Tikeut Rieul Mieum Pieup Sios Ieung Cieuc Chieuch Khieukh Thieuth Phieuph Hieuh');
const hangulEn = i => HANGUL_EN[i % 14] + (i >= 14 ? ' A' : '');
setNames(range([0x3260, 0x327B]), i => ({ ko: '원 문자 ' + HANGUL_KO[i], en: 'Circled Hangul ' + hangulEn(i) }));
setNames(range([0x3200, 0x321B]), i => ({ ko: '괄호 문자 ' + HANGUL_KO[i], en: 'Parenthesized Hangul ' + hangulEn(i) }));

// 영문 · 숫자 원 문자 · 괄호 문자 (숫자는 1~15)
const numberEn = n => (n < 10 ? 'Digit ' : 'Number ') + NUMBER_WORDS[n];
setNames(range([0x24D0, 0x24E9]), i => ({ ko: '원 문자 ' + LATIN_UPPER[i].toLowerCase(), en: 'Circled Latin Small Letter ' + LATIN_UPPER[i] }));
setNames(range([0x2460, 0x246E]), i => ({ ko: '원 문자 ' + (i + 1), en: 'Circled ' + numberEn(i + 1) }));
setNames(range([0x249C, 0x24B5]), i => ({ ko: '괄호 문자 ' + LATIN_UPPER[i].toLowerCase(), en: 'Parenthesized Latin Small Letter ' + LATIN_UPPER[i] }));
setNames(range([0x2474, 0x2482]), i => ({ ko: '괄호 문자 ' + (i + 1), en: 'Parenthesized ' + numberEn(i + 1) }));

// 전각 숫자 · 로마 숫자
setNames(range([0xFF10, 0xFF19]), i => ({ ko: '전각 숫자 ' + i, en: 'Fullwidth Digit ' + NUMBER_WORDS[i] }));
setNames(range([0x2170, 0x2179]), i => ({ ko: '소문자 로마 숫자 ' + (i + 1), en: 'Small Roman Numeral ' + NUMBER_WORDS[i + 1] }));
setNames(range([0x2160, 0x2169]), i => ({ ko: '대문자 로마 숫자 ' + (i + 1), en: 'Roman Numeral ' + NUMBER_WORDS[i + 1] }));

// 전각 영문
setNames(range([0xFF21, 0xFF3A]), i => ({ ko: '전각 대문자 ' + LATIN_UPPER[i], en: 'Fullwidth Latin Capital Letter ' + LATIN_UPPER[i] }));
setNames(range([0xFF41, 0xFF5A]), i => ({ ko: '전각 소문자 ' + LATIN_UPPER[i].toLowerCase(), en: 'Fullwidth Latin Small Letter ' + LATIN_UPPER[i] }));

// 가나: "유니코드 명칭=한글 표기" 목록. '*'는 작은 글자. 히라가나는 앞 83자, 가타카나는 86자 전부 사용
const KANA = list(
  '*A=아 A=아 *I=이 I=이 *U=우 U=우 *E=에 E=에 *O=오 O=오 ' +
  'Ka=카 Ga=가 Ki=키 Gi=기 Ku=쿠 Gu=구 Ke=케 Ge=게 Ko=코 Go=고 ' +
  'Sa=사 Za=자 Si=시 Zi=지 Su=스 Zu=즈 Se=세 Ze=제 So=소 Zo=조 ' +
  'Ta=타 Da=다 Ti=치 Di=지 *Tu=쓰 Tu=쓰 Du=즈 Te=테 De=데 To=토 Do=도 ' +
  'Na=나 Ni=니 Nu=누 Ne=네 No=노 ' +
  'Ha=하 Ba=바 Pa=파 Hi=히 Bi=비 Pi=피 Hu=후 Bu=부 Pu=푸 He=헤 Be=베 Pe=페 Ho=호 Bo=보 Po=포 ' +
  'Ma=마 Mi=미 Mu=무 Me=메 Mo=모 *Ya=야 Ya=야 *Yu=유 Yu=유 *Yo=요 Yo=요 ' +
  'Ra=라 Ri=리 Ru=루 Re=레 Ro=로 *Wa=와 Wa=와 Wi=위 We=웨 Wo=오 N=응 ' +
  'Vu=부 *Ka=카 *Ke=케'
).map(token => {
  const small = token.startsWith('*');
  const [en, ko] = token.replace('*', '').split('=');
  return { ko: (small ? '작은 ' : '') + ko, en: (small ? 'Small ' : '') + en };
});
setNames(range([0x3041, 0x3093]), i => ({ ko: '히라가나 ' + KANA[i].ko, en: 'Hiragana Letter ' + KANA[i].en }));
setNames(range([0x30A1, 0x30F6]), i => ({ ko: '가타카나 ' + KANA[i].ko, en: 'Katakana Letter ' + KANA[i].en }));

// 키릴 문자: "유니코드 명칭=한글 명칭" 목록 ('_'는 공백). 표와 같은 순서(Ё가 Е 뒤)
const CYRILLIC = list(
  'A=아 Be=베 Ve=베 Ghe=게 De=데 Ie=예 Io=요 Zhe=제 Ze=제 I=이 Short_I=짧은_이 Ka=카 El=엘 Em=엠 En=엔 O=오 Pe=페 ' +
  'Er=에르 Es=에스 Te=테 U=우 Ef=에프 Ha=하 Tse=체 Che=체 Sha=샤 Shcha=시차 Hard_Sign=경음_부호 Yeru=예리 ' +
  'Soft_Sign=연음_부호 E=에 Yu=유 Ya=야'
).map(token => {
  const [en, ko] = token.replace(/_/g, ' ').split('=');
  return { ko, en };
});
setNames(range([0x0410, 0x0415], [0x0401, 0x0401], [0x0416, 0x042F]),
  i => ({ ko: '키릴 대문자 ' + CYRILLIC[i].ko, en: 'Cyrillic Capital Letter ' + CYRILLIC[i].en }));
setNames(range([0x0430, 0x0435], [0x0451, 0x0451], [0x0436, 0x044F]),
  i => ({ ko: '키릴 소문자 ' + CYRILLIC[i].ko, en: 'Cyrillic Small Letter ' + CYRILLIC[i].en }));

// 한글·영문 명칭 조합: 둘 다 있으면 "한글 (영문)", 하나만 있으면 그것만, 둘 다 없으면 빈 문자열
function nameOf(ch) {
  const { ko = '', en = '' } = NAMES[ch] || {};
  if (ko && en) return `${ko} (${en})`;
  return ko || en;
}

const codeOf = ch => 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');

const stickyEl = document.getElementById('sticky');
const searchEl = document.getElementById('search');
const resultEl = document.getElementById('result');
const toolbarEl = document.getElementById('toolbar');
const groupsEl = document.getElementById('groups');
const emptyEl = document.getElementById('empty');
const tooltipEl = document.getElementById('tooltip');

// 그룹별 화면 요소 모음: { link, section, countEl, cells }
const views = GROUPS.map(group => {
  const id = 'g-' + group.key.codePointAt(0).toString(16);
  const hint = group.key + ' + 한자';

  const link = document.createElement('a');
  link.href = '#' + id;
  link.title = hint;
  link.innerHTML = '<span class="key"></span>';
  link.firstChild.textContent = group.key;
  link.append(group.name);
  toolbarEl.appendChild(link);

  const section = document.createElement('section');
  section.className = 'panel group';
  section.id = id;
  section.setAttribute('aria-labelledby', id + '-title');

  const h2 = document.createElement('h2');
  h2.id = id + '-title';
  h2.innerHTML = '<span class="key" aria-hidden="true"></span><span class="name"></span>' +
    '<span class="hint"></span><span class="count"></span>';
  h2.querySelector('.key').textContent = group.key;
  h2.querySelector('.name').textContent = group.name;
  h2.querySelector('.hint').textContent = hint;
  const countEl = h2.querySelector('.count');
  section.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';
  const cells = group.chars.map((ch, i) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    // 그룹마다 한 칸만 Tab으로 들어가고 나머지는 방향키로 이동 (roving tabindex)
    cell.tabIndex = i === 0 ? 0 : -1;
    const name = nameOf(ch);
    const code = codeOf(ch);
    cell.dataset.char = ch;
    cell.dataset.name = name;
    cell.dataset.code = code;
    cell.dataset.search = [ch, name, code, group.key, group.name].join('\n').toLowerCase();
    cell.setAttribute('aria-label', name ? `${name}, ${code}` : code);
    if (LABELS[ch]) {
      cell.classList.add('label');
      cell.textContent = LABELS[ch];
    } else {
      cell.textContent = ch;
    }
    grid.appendChild(cell);
    return cell;
  });
  section.appendChild(grid);
  groupsEl.appendChild(section);

  return { link, section, countEl, cells };
});

// ---------- 검색 ----------

function setTabStop(cell) {
  const prev = cell.parentElement.querySelector('.cell[tabindex="0"]');
  if (prev && prev !== cell) prev.tabIndex = -1;
  cell.tabIndex = 0;
}

function applyFilter() {
  const query = searchEl.value.trim().toLowerCase();
  let total = 0;
  for (const view of views) {
    const visible = [];
    for (const cell of view.cells) {
      const hit = !query || cell.dataset.search.includes(query);
      cell.hidden = !hit;
      if (hit) visible.push(cell);
    }
    view.section.hidden = view.link.hidden = visible.length === 0;
    view.countEl.textContent = query
      ? `${visible.length} / ${view.cells.length}자`
      : `${view.cells.length}자`;
    // Tab으로 들어갈 칸이 걸러져 숨었으면 보이는 첫 칸으로 옮김
    if (visible.length && !visible.some(cell => cell.tabIndex === 0)) setTabStop(visible[0]);
    total += visible.length;
  }
  resultEl.textContent = query ? `${total}자 찾음` : '';
  emptyEl.hidden = total > 0;
  hideTooltip();
  updateActiveLink();
}
searchEl.addEventListener('input', applyFilter);

// ---------- 바로가기 메뉴 ----------

// 메뉴가 여러 줄로 감겨도 섹션 제목이 가려지지 않도록 고정 영역 높이를 반영
function syncStickyHeight() {
  document.documentElement.style.setProperty('--sticky-h', stickyEl.offsetHeight + 'px');
}

// 지금 보고 있는 그룹을 메뉴에 표시
let activeView = null;
function updateActiveLink() {
  const shown = views.filter(view => !view.section.hidden);
  const line = stickyEl.offsetHeight + 12;
  let current = shown[0] || null;
  for (const view of shown) {
    if (view.section.getBoundingClientRect().top > line) break;
    current = view;
  }
  // 마지막 그룹은 짧아서 기준선에 닿지 못할 수 있으므로 문서 끝에서는 마지막 그룹으로 간주
  if (shown.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
    current = shown[shown.length - 1];
  }
  if (current === activeView) return;
  if (activeView) activeView.link.removeAttribute('aria-current');
  activeView = current;
  if (!current) return;
  current.link.setAttribute('aria-current', 'true');
  // 메뉴가 가로 스크롤일 때(모바일) 현재 그룹이 보이도록 메뉴만 이동
  if (toolbarEl.scrollWidth > toolbarEl.clientWidth) {
    const link = current.link;
    toolbarEl.scrollLeft = link.offsetLeft - (toolbarEl.clientWidth - link.offsetWidth) / 2;
  }
}

function onLayoutChange() {
  syncStickyHeight();
  updateActiveLink();
}
if ('ResizeObserver' in window) {
  new ResizeObserver(onLayoutChange).observe(stickyEl);
} else {
  window.addEventListener('resize', onLayoutChange);
}

let scrollQueued = false;
window.addEventListener('scroll', () => {
  hideTooltip();
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => {
    scrollQueued = false;
    updateActiveLink();
  });
}, { passive: true });

// ---------- 툴팁 ----------

// 브라우저 기본 title 툴팁은 지연이 있어 직접 그린 툴팁을 즉시 표시
function showTooltip(cell) {
  const { name, code } = cell.dataset;
  tooltipEl.textContent = name ? name + ' · ' : '';
  const codeEl = document.createElement('span');
  codeEl.className = 'code';
  codeEl.textContent = code;
  tooltipEl.appendChild(codeEl);

  // 크기를 재기 전에 왼쪽 위로 옮겨 화면 폭에 눌리지 않게 함
  tooltipEl.style.left = '0px';
  tooltipEl.style.top = '0px';
  tooltipEl.hidden = false;
  const rect = cell.getBoundingClientRect();
  const tipRect = tooltipEl.getBoundingClientRect();
  const viewportWidth = document.documentElement.clientWidth;
  const margin = 6;
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(margin, Math.min(left, viewportWidth - tipRect.width - margin));
  let top = rect.top - tipRect.height - margin;
  if (top < stickyEl.getBoundingClientRect().bottom) top = rect.bottom + margin;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function hideTooltip() {
  tooltipEl.hidden = true;
}

// 터치에서는 누른 뒤 툴팁이 계속 남으므로 마우스·펜으로 가리킬 때만 표시 (터치는 복사 알림에 명칭 표시)
groupsEl.addEventListener('pointerover', (e) => {
  if (e.pointerType === 'touch') return;
  const cell = e.target.closest('.cell');
  if (cell) showTooltip(cell);
  else hideTooltip();
});
groupsEl.addEventListener('pointerleave', hideTooltip);
groupsEl.addEventListener('focusin', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  setTabStop(cell);
  // 키보드로 옮겨 온 경우에만 표시
  if (cell.matches(':focus-visible')) showTooltip(cell);
});
groupsEl.addEventListener('focusout', hideTooltip);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideTooltip();
});

// ---------- 방향키 이동 ----------

groupsEl.addEventListener('keydown', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || e.altKey || e.ctrlKey || e.metaKey) return;

  const visible = Array.from(cell.parentElement.children).filter(c => !c.hidden);
  const index = visible.indexOf(cell);
  const last = visible.length - 1;
  // 첫 줄에 놓인 칸 수 = 한 줄의 칸 수
  const cols = visible.filter(c => c.offsetTop === visible[0].offsetTop).length;
  let next;
  switch (e.key) {
    case 'ArrowRight': next = index + 1; break;
    case 'ArrowLeft': next = index - 1; break;
    case 'ArrowUp': next = index - cols; break;
    case 'ArrowDown':
      next = index + cols;
      // 바로 아래 칸이 없어도 아랫줄이 있으면 그 줄의 마지막 칸으로
      if (next > last && Math.floor(index / cols) < Math.floor(last / cols)) next = last;
      break;
    case 'Home': next = 0; break;
    case 'End': next = last; break;
    default: return;
  }
  e.preventDefault();
  if (next < 0 || next > last) return;
  visible[next].focus();
});

// ---------- 복사 ----------

const copiedTimers = new WeakMap();
groupsEl.addEventListener('click', async (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;

  const ch = cell.dataset.char;
  const shown = LABELS[ch] || ch;
  if (!(await copyText(ch))) {
    showToast(`복사하지 못했습니다: ${shown} (${cell.dataset.code})`, true);
    return;
  }

  cell.classList.add('copied');
  clearTimeout(copiedTimers.get(cell));
  copiedTimers.set(cell, setTimeout(() => cell.classList.remove('copied'), 600));

  const { ko = '', en = '' } = NAMES[ch] || {};
  const name = ko || en;
  showToast(`복사됨: ${shown}${name ? ' ' + name : ''} (${cell.dataset.code})`);
});

applyFilter();
onLayoutChange();
</script>

</body>
</html>
