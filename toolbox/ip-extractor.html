<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="텍스트에 섞인 IPv4 주소만 골라내는 추출기">
<title>IP 추출기 · Toolbox</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/toolbox.css">
</head>
<body>

<nav class="tool-nav" aria-label="Toolbox 도구 목록">
  <a class="brand" href="index.html"><span class="keycap" aria-hidden="true">T</span>Toolbox</a>
  <a href="ip-subnet-calculator.html">서브넷 IP 계산기</a>
  <a href="ip-extractor.html" aria-current="page">IP 추출기</a>
  <a href="special-characters.html">특수문자표</a>
</nav>

<main>
<h1>IP 추출기</h1>
<p class="desc">
  텍스트에 섞여 있는 IPv4 주소만 골라냅니다.
  기본은 입력과 같은 줄 번호를 유지해(IP가 없는 줄은 빈 줄) 스프레드시트 열에 그대로 붙여넣을 수 있습니다.
</p>

<div class="panes">
  <div class="panel">
    <div class="panel-head">
      <h2><label for="input">입력</label></h2>
      <span class="count" id="inputCount">0줄</span>
    </div>
    <textarea id="input" class="field" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
      placeholder="1.234.78.200_순수관제&#10;192.168.0.2_텍스트&#10;텍스트으으으&#10;서버 10.0.0.1, 10.0.0.2 점검"></textarea>
    <div class="options">
      <label><input type="checkbox" id="collectMode"> IP만 모아보기 (한 줄의 여러 IP 모두 추출)</label>
      <label class="disabled"><input type="checkbox" id="dedupe" disabled aria-describedby="collectHint"> 중복 제거</label>
      <label class="disabled"><input type="checkbox" id="sortIps" disabled aria-describedby="collectHint"> 정렬</label>
      <label><input type="checkbox" id="keepCidr"> CIDR 표기(/24) 유지</label>
      <span class="opt-hint" id="collectHint">중복 제거와 정렬은 모아보기에서 쓸 수 있습니다.</span>
    </div>
    <div class="actions">
      <button id="extractBtn" type="button" class="btn">추출<span class="kbd-hint" aria-hidden="true"><kbd>Ctrl</kbd><kbd>Enter</kbd></span></button>
      <button id="clearBtn" type="button" class="btn secondary">지우기</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2><label for="output">추출된 IP 목록</label></h2>
      <span class="head-meta">
        <span class="stale-hint" id="staleHint" hidden>입력 변경됨, 다시 추출 필요</span>
        <span class="count" id="outputCount">0개</span>
      </span>
    </div>
    <textarea id="output" class="field" readonly spellcheck="false" placeholder="추출 결과가 여기에 표시됩니다."></textarea>
    <div class="actions">
      <button id="copyBtn" type="button" class="btn tonal" disabled>복사</button>
      <button id="downloadBtn" type="button" class="btn secondary" disabled>.txt 저장</button>
    </div>
  </div>
</div>

<div id="status" class="status" role="status" aria-live="polite"></div>
</main>

<script src="assets/toolbox.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const inputEl = $('input');
const outputEl = $('output');
const statusEl = $('status');
const copyBtn = $('copyBtn');
const downloadBtn = $('downloadBtn');
const collectModeEl = $('collectMode');
const keepCidrEl = $('keepCidr');
const collectHintEl = $('collectHint');
const inputCountEl = $('inputCount');
const outputCountEl = $('outputCount');

// 앞뒤가 숫자/점으로 이어지지 않는 "a.b.c.d" 형태 (문장 끝 마침표 "1.2.3.4." 는 허용)
// 뒤에 선택적으로 "/prefix" 가 붙을 수 있음. 자릿수는 제한하지 않고 값으로 검사해
// "/245" 처럼 범위를 벗어난 표기도 조용히 버리지 않고 안내한다.
// lookbehind 는 Safari 16.4 미만에서 문법 오류가 나므로, 앞 글자를 직접 소비하는 방식으로 검사
const IP_RE = /(^|[^\d.])(\d{1,3}(?:\.\d{1,3}){3})(?:\/(\d+))?(?!\d|\.\d)/g;

// 한 줄에서 유효한 IPv4 주소를 모두 찾아 { text, badPrefix, leadingZero } 배열로 반환
// 옥텟의 앞자리 0 은 10진수로 읽고 제거해 정규화 (010.001.001.001 → 10.1.1.1). 몇 개를 고쳤는지 안내한다.
function extractIps(line, keepCidr) {
  const result = [];
  for (const m of line.matchAll(IP_RE)) {
    const parts = m[2].split('.');
    const octets = parts.map(Number);
    if (octets.some(n => n > 255)) continue;
    const ip = octets.join('.');
    const hasPrefix = keepCidr && m[3] !== undefined;
    const validPrefix = hasPrefix && Number(m[3]) <= 32;
    result.push({
      text: validPrefix ? `${ip}/${Number(m[3])}` : ip,
      badPrefix: hasPrefix && !validPrefix,
      leadingZero: parts.some(p => p.length > 1 && p[0] === '0'),
    });
  }
  return result;
}

function ipSortKey(s) {
  const [ip, prefix = '32'] = s.split('/');
  const n = ip.split('.').reduce((acc, p) => acc * 256 + Number(p), 0);
  return n * 64 + Number(prefix);
}

// 맨 끝의 줄바꿈 하나는 "마지막 줄의 끝"으로 보고 빈 줄로 세지 않음
function splitLines(text) {
  if (text === '') return [];
  const lines = text.split(/\r\n|\r|\n/);
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

// 입력할 때마다 호출되므로 배열을 만들지 않고 줄바꿈 개수만 셈 (textarea 값은 항상 \n 으로 정규화됨)
function countLines(text) {
  if (text === '') return 0;
  let n = 1;
  for (let i = text.indexOf('\n'); i !== -1; i = text.indexOf('\n', i + 1)) n++;
  if (n > 1 && text.endsWith('\n')) n--;
  return n;
}

// "중복 제거", "정렬"은 모아보기 모드에서만 동작하므로, 꺼져 있을 때는 비활성 + 체크 해제 + 이유 안내
// 모아보기를 다시 켜면 사용자가 마지막으로 고른 값(처음엔 체크)을 복원
const collectOnlyOptions = [
  { el: $('dedupe'), preference: true },
  { el: $('sortIps'), preference: true },
];
const [dedupeOpt, sortOpt] = collectOnlyOptions;

function syncOptions() {
  const collect = collectModeEl.checked;
  for (const opt of collectOnlyOptions) {
    opt.el.disabled = !collect;
    opt.el.checked = collect && opt.preference;
    opt.el.closest('label').classList.toggle('disabled', !collect);
  }
  collectHintEl.hidden = collect;
}

function setSummary(text) {
  const el = document.createElement('div');
  el.className = 'summary';
  el.textContent = text;
  statusEl.replaceChildren(el);
}

function setOutput(text, ipCount) {
  outputEl.value = text;
  outputCountEl.textContent = `${fmt(ipCount)}개`;
  copyBtn.disabled = downloadBtn.disabled = ipCount === 0;
}

function extract() {
  const lines = splitLines(inputEl.value);
  const perLine = lines.map(line => extractIps(line, keepCidrEl.checked));

  let summary;
  let used; // 실제로 결과에 쓰인 항목
  if (collectModeEl.checked) {
    used = perLine.flat();
    let ips = used.map(item => item.text);
    const found = ips.length;
    if (dedupeOpt.el.checked) ips = Array.from(new Set(ips));
    if (sortOpt.el.checked) ips.sort((a, b) => ipSortKey(a) - ipSortKey(b));
    setOutput(ips.join('\n'), ips.length);
    summary = `총 ${fmt(lines.length)}줄에서 IP ${fmt(found)}개를 찾았습니다.`;
    if (found !== ips.length) summary += ` (중복 ${fmt(found - ips.length)}개 제거)`;
  } else {
    // 각 줄의 첫 번째 IP만 남기고 나머지는 빈 줄 처리 (행 번호는 그대로 유지)
    used = perLine.filter(ips => ips.length).map(ips => ips[0]);
    const multiLines = perLine.filter(ips => ips.length > 1).length;
    // IP가 하나도 없으면 줄바꿈만 채우지 않고 결과를 비움
    setOutput(used.length ? perLine.map(ips => (ips[0] ? ips[0].text : '')).join('\n') : '', used.length);
    summary = `총 ${fmt(lines.length)}줄 중 ${fmt(used.length)}개 줄에서 IP를 추출했습니다.`;
    if (multiLines) summary += ` IP가 2개 이상인 줄 ${fmt(multiLines)}개는 첫 번째 IP만 사용했습니다. 모두 필요하면 "IP만 모아보기"를 켜세요.`;
  }
  const badPrefixes = used.filter(item => item.badPrefix).length;
  if (badPrefixes) summary += ` 범위를 벗어난 CIDR 표기(/33 이상) ${fmt(badPrefixes)}개는 무시하고 IP만 남겼습니다.`;
  const leadingZeros = used.filter(item => item.leadingZero).length;
  if (leadingZeros) summary += ` 앞자리에 0이 붙은 IP ${fmt(leadingZeros)}개는 10진수로 읽고 0을 뺐습니다(010.1.1.1 → 10.1.1.1). 8진수 표기였다면 원본을 확인하세요.`;
  if (!used.length) summary = `총 ${fmt(lines.length)}줄에서 IP를 찾지 못했습니다.`;
  if (!lines.length) summary = '입력된 데이터가 없습니다.';
  setSummary(summary);

  // 결과가 없으면 결과창 대신 상태 메시지로 이동
  if (!lines.length) return null;
  return used.length ? outputEl : statusEl;
}

const runner = createRunner({
  input: inputEl,
  output: outputEl,
  status: statusEl,
  staleHint: $('staleHint'),
  runBtn: $('extractBtn'),
  clearBtn: $('clearBtn'),
  copyBtn,
  downloadBtn,
  compute: extract,
  reset() {
    setOutput('', 0);
    statusEl.textContent = '';
  },
  updateCount() {
    inputCountEl.textContent = `${fmt(countLines(inputEl.value))}줄`;
  },
  copyLabel: () => 'IP ' + outputCountEl.textContent,
  filename: 'extracted-ips.txt',
});

collectModeEl.addEventListener('change', () => { syncOptions(); runner.rerun(); });
keepCidrEl.addEventListener('change', runner.rerun);
for (const opt of collectOnlyOptions) {
  opt.el.addEventListener('change', () => { opt.preference = opt.el.checked; runner.rerun(); });
}

syncOptions();
</script>

</body>
</html>
