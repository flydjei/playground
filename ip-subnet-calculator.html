<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CIDR 서브넷, IP 범위를 개별 IP 목록으로 펼쳐주는 계산기">
<title>서브넷 IP 목록 계산기</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
</head>
<body>

<nav class="tool-nav" aria-label="도구 목록">
  <a href="ip-subnet-calculator.html" aria-current="page">서브넷 IP 계산기</a>
  <a href="ip-extractor.html">IP 추출기</a>
  <a href="special-characters.html">특수문자표</a>
</nav>

<h1>서브넷 IP 목록 계산기</h1>
<p class="desc">
  CIDR(<code>172.17.0.0/24</code>), 범위(<code>10.0.0.1-10.0.0.20</code>, <code>10.0.0.1~10.0.0.20</code>, <code>10.0.0.1-20</code>), 단일 IP를 입력하면 개별 IP 목록으로 펼쳐줍니다.
  줄바꿈·쉼표·세미콜론·공백으로 여러 항목을 구분할 수 있습니다.
</p>

<div class="panes">
  <div class="panel">
    <div class="panel-head">
      <h2><label for="input">입력</label></h2>
      <span class="count" id="inputCount">0개 항목</span>
    </div>
    <textarea id="input" class="field" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
      placeholder="172.17.0.0/24&#10;10.0.0.0/30&#10;192.168.1.10-20&#10;192.168.1.5"></textarea>
    <div class="options">
      <label><input type="checkbox" id="excludeEdges"> 네트워크/브로드캐스트 주소 제외 (CIDR 항목만)</label>
      <label><input type="checkbox" id="dedupe" checked> 중복 제거 및 정렬</label>
    </div>
    <div class="actions">
      <button id="calcBtn" type="button" class="btn">계산<span class="kbd-hint">Ctrl+Enter</span></button>
      <button id="clearBtn" type="button" class="btn secondary">지우기</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2><label for="output">개별 IP 목록</label></h2>
      <span class="head-meta">
        <span class="stale-hint" id="staleHint" hidden>입력 변경됨 · 다시 계산 필요</span>
        <span class="count" id="outputCount">0개</span>
      </span>
    </div>
    <textarea id="output" class="field" readonly spellcheck="false" placeholder="계산 결과가 여기에 표시됩니다."></textarea>
    <div class="actions">
      <button id="copyBtn" type="button" class="btn" disabled>복사</button>
      <button id="downloadBtn" type="button" class="btn secondary" disabled>.txt 저장</button>
    </div>
  </div>
</div>

<div id="status" class="status" role="status" aria-live="polite"></div>

<script src="common.js"></script>
<script>
const MAX_PER_ENTRY = 65536; // 항목당 최대 IP 개수 (2^16, /16 대역까지 허용)
const MAX_TOTAL = 200000;    // 전체 합산 최대 IP 개수 (중복 제거 시에는 제거 후 기준)
const MAX_INFO_INLINE = 10;  // 항목별 안내가 이보다 많으면 접어서 표시

const $ = (id) => document.getElementById(id);
const inputEl = $('input');
const outputEl = $('output');
const statusEl = $('status');
const calcBtn = $('calcBtn');
const clearBtn = $('clearBtn');
const copyBtn = $('copyBtn');
const downloadBtn = $('downloadBtn');
const excludeEdgesEl = $('excludeEdges');
const dedupeEl = $('dedupe');
const inputCountEl = $('inputCount');
const outputCountEl = $('outputCount');
const staleHintEl = $('staleHint');

let lastRunInput = null; // 마지막으로 계산한 입력값 (계산 전에는 null)
let undoSnapshot = null; // "지우기" 직전 상태 (되돌리기용)

function ipToLong(ip) {
  const parts = ip.split('.');
  if (parts.length !== 4) return null;
  let result = 0;
  for (const p of parts) {
    // 선행 0(예: 010)은 도구에 따라 8진수로 해석될 수 있어 허용하지 않음
    if (!/^(0|[1-9]\d{0,2})$/.test(p)) return null;
    const n = Number(p);
    if (n > 255) return null;
    result = result * 256 + n;
  }
  return result;
}

function longToIp(long) {
  return [
    (long >>> 24) & 255,
    (long >>> 16) & 255,
    (long >>> 8) & 255,
    long & 255
  ].join('.');
}

function maskFromPrefix(prefix) {
  if (prefix === 0) return 0;
  return (0xFFFFFFFF << (32 - prefix)) >>> 0;
}

function splitEntries(text) {
  // "10.0.0.1 - 10.0.0.20", "10.0.0.0 /24" 처럼 구분 기호 주변에 공백이 있어도
  // 한 항목으로 인식되도록, 같은 줄 안의 공백을 먼저 제거한다.
  return text
    .replace(/[ \t]*([-~/])[ \t]*/g, '$1')
    .split(/[\s,;]+/)
    .filter(Boolean);
}

function ipError(entry, ip) {
  return new Error(/(^|\.)0\d/.test(ip)
    ? `선행 0이 포함된 IP 주소는 허용되지 않습니다: "${entry}"`
    : `잘못된 IP 주소: "${entry}"`);
}

// 한 항목을 파싱해 { source, kind, start, end, (network, broadcast, prefix, hostBits) } 반환
//  - CIDR:  172.17.0.0/24
//  - 범위:  10.0.0.1-10.0.0.20, 10.0.0.1~10.0.0.20  또는  10.0.0.1-20 (마지막 옥텟 축약)
//  - 단일:  192.168.1.5
function parseEntry(entry) {
  if (entry.includes('/')) {
    const m = entry.match(/^([^/]+)\/(\d{1,2})$/);
    if (!m) throw new Error(`잘못된 서브넷 표기: "${entry}"`);
    const prefix = Number(m[2]);
    if (prefix > 32) throw new Error(`잘못된 프리픽스(0~32): "${entry}"`);
    const ipLong = ipToLong(m[1]);
    if (ipLong === null) throw ipError(entry, m[1]);

    const mask = maskFromPrefix(prefix);
    const network = (ipLong & mask) >>> 0;
    const broadcast = (network | (~mask >>> 0)) >>> 0;
    return {
      source: entry, kind: 'cidr', prefix, network, broadcast,
      start: network, end: broadcast, hostBits: ipLong !== network
    };
  }

  if (/[-~]/.test(entry)) {
    const [a, b, ...rest] = entry.split(/[-~]/);
    if (rest.length) throw new Error(`잘못된 범위 표기: "${entry}"`);
    const start = ipToLong(a);
    if (start === null) throw ipError(entry, a);

    let end;
    if (/^\d{1,3}$/.test(b)) {
      const last = Number(b);
      if (last > 255) throw new Error(`잘못된 범위 끝값: "${entry}"`);
      end = (start - (start % 256)) + last;
    } else {
      end = ipToLong(b);
    }
    if (end === null) throw ipError(entry, b);
    if (end < start) throw new Error(`범위의 끝이 시작보다 작습니다: "${entry}"`);
    return { source: entry, kind: 'range', start, end };
  }

  const ipLong = ipToLong(entry);
  if (ipLong === null) throw ipError(entry, entry);
  return { source: entry, kind: 'single', start: ipLong, end: ipLong };
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// start/end 는 실제로 출력에 사용된 범위 (네트워크/브로드캐스트 제외 반영)
function describe(parsed, start, end, edgesExcluded) {
  const count = end - start + 1;
  const src = `<code>${escapeHtml(parsed.source)}</code>`;
  if (parsed.kind === 'cidr') {
    let html = `${src} → ${longToIp(start)} ~ ${longToIp(end)}` +
      ` (마스크 ${longToIp(maskFromPrefix(parsed.prefix))}, ${fmt(count)}개` +
      (edgesExcluded ? ', 네트워크/브로드캐스트 제외' : '') + ')';
    if (parsed.hostBits) {
      html = `⚠ ${html} — 호스트 비트가 설정되어 있어 <code>${longToIp(parsed.network)}/${parsed.prefix}</code> 로 보정했습니다.`;
    }
    return html;
  }
  if (parsed.kind === 'range') {
    return `${src} → ${longToIp(start)} ~ ${longToIp(end)} (${fmt(count)}개)`;
  }
  return null;
}

// 정렬·병합된 구간 목록(merged)에 [start, end] 를 합친다.
// 새로 추가되는 IP 개수를 반환하며, remaining 을 넘으면 아무것도 바꾸지 않고 -1 을 반환한다.
function addInterval(merged, start, end, remaining) {
  // start 와 겹치거나 바로 맞닿는 첫 구간을 이진 탐색
  let lo = 0, hi = merged.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (merged[mid][1] < start - 1) lo = mid + 1; else hi = mid;
  }
  let to = lo, overlap = 0, ns = start, ne = end;
  while (to < merged.length && merged[to][0] <= end + 1) {
    const [s, e] = merged[to];
    overlap += Math.max(0, Math.min(end, e) - Math.max(start, s) + 1);
    if (s < ns) ns = s;
    if (e > ne) ne = e;
    to++;
  }
  const added = (end - start + 1) - overlap;
  if (added > remaining) return -1;
  merged.splice(lo, to - lo, [ns, ne]);
  return added;
}

function updateInputCount() {
  inputCountEl.textContent = `${fmt(splitEntries(inputEl.value).length)}개 항목`;
}

// 계산 후 입력이 바뀌면 결과가 더 이상 최신이 아님을 표시 (원래 입력으로 되돌리면 해제)
function updateStale() {
  const stale = lastRunInput !== null && inputEl.value !== lastRunInput;
  staleHintEl.hidden = !stale;
  outputEl.classList.toggle('stale', stale);
}

function setUndo(snapshot) {
  undoSnapshot = snapshot;
  clearBtn.textContent = snapshot ? '되돌리기' : '지우기';
}

function setOutput(ips) {
  outputEl.value = ips.join('\n');
  outputCountEl.textContent = `${fmt(ips.length)}개`;
  copyBtn.disabled = downloadBtn.disabled = ips.length === 0;
}

function renderList(notes) {
  return `<ul>${notes.map(n => `<li class="${n.cls}">${n.html}</li>`).join('')}</ul>`;
}

function calculate({ scroll = true } = {}) {
  const entries = splitEntries(inputEl.value);
  const excludeEdges = excludeEdgesEl.checked;
  const dedupe = dedupeEl.checked;
  const accepted = []; // 입력 순서 그대로의 [start, end] (중복 제거 안 할 때 사용)
  const merged = [];   // 정렬·병합된 [start, end] (중복 제거 시 사용)
  const issues = [];   // 오류·경고 { cls, html }
  const infos = [];    // 항목별 안내 { cls, html }
  let errorCount = 0;
  let total = 0;       // 채택된 항목의 IP 개수 합 (중복 포함)
  let unique = 0;      // 병합 후 고유 IP 개수

  for (const entry of entries) {
    let parsed;
    try {
      parsed = parseEntry(entry);
    } catch (err) {
      errorCount++;
      issues.push({ cls: 'error', html: `✖ ${escapeHtml(err.message)}` });
      continue;
    }

    let { start, end } = parsed;
    // /31, /32 는 네트워크/브로드캐스트 구분이 없으므로 제외하지 않음 (RFC 3021)
    const edgesExcluded = excludeEdges && parsed.kind === 'cidr' && parsed.prefix <= 30;
    if (edgesExcluded) {
      start += 1;
      end -= 1;
    }
    const count = end - start + 1;
    const src = `<code>${escapeHtml(entry)}</code>`;

    if (count > MAX_PER_ENTRY) {
      issues.push({ cls: 'warn', html: `⚠ ${src} 는 IP ${fmt(count)}개로 너무 많아 건너뜁니다. (항목당 최대 ${fmt(MAX_PER_ENTRY)}개)` });
      continue;
    }

    // 한도를 넘는 항목만 건너뛰고, 이후 항목은 계속 검사한다.
    const overLimit = { cls: 'warn', html: `⚠ ${src} 를 추가하면 전체 IP 개수가 ${fmt(MAX_TOTAL)}개를 초과하여 건너뜁니다.` };
    if (dedupe) {
      const added = addInterval(merged, start, end, MAX_TOTAL - unique);
      if (added < 0) { issues.push(overLimit); continue; }
      unique += added;
    } else {
      if (total + count > MAX_TOTAL) { issues.push(overLimit); continue; }
      accepted.push([start, end]);
    }
    total += count;

    const info = describe(parsed, start, end, edgesExcluded);
    if (info) (parsed.hostBits ? issues : infos).push({ cls: parsed.hostBits ? 'warn' : '', html: info });
  }

  const ips = [];
  for (const [s, e] of dedupe ? merged : accepted) {
    for (let cur = s; cur <= e; cur++) ips.push(longToIp(cur));
  }
  const removed = dedupe ? total - unique : 0;

  setOutput(ips);
  lastRunInput = inputEl.value;
  updateStale();

  let summary = entries.length
    ? `총 ${fmt(ips.length)}개의 IP가 생성되었습니다.`
    : '입력된 항목이 없습니다.';
  if (removed) summary += ` (중복 ${fmt(removed)}개 제거)`;
  if (errorCount) summary += ` · 오류 ${fmt(errorCount)}건`;

  let html = `<div class="summary">${summary}</div>`;
  if (issues.length) html += renderList(issues);
  if (infos.length > MAX_INFO_INLINE) {
    html += `<details><summary>항목별 상세 ${fmt(infos.length)}건</summary>${renderList(infos)}</details>`;
  } else if (infos.length) {
    html += renderList(infos);
  }
  statusEl.innerHTML = html;

  // 모바일(세로 배치)에서는 결과 영역이 화면 아래에 있으므로 자동으로 스크롤.
  // 결과가 없으면(전부 오류 등) 결과창 대신 상태 메시지로 이동한다.
  if (scroll && entries.length && window.matchMedia(MOBILE_QUERY).matches) {
    (ips.length ? outputEl : statusEl).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

calcBtn.addEventListener('click', () => calculate());

inputEl.addEventListener('input', () => {
  updateInputCount();
  updateStale();
  if (undoSnapshot) setUndo(null);
});

// 입력창 밖(체크박스 등)에 포커스가 있어도 단축키가 동작하도록 문서 전체에서 처리
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
    e.preventDefault();
    calculate();
  }
});

// 이미 계산한 적이 있으면 옵션 변경 시 바로 다시 계산
for (const el of [excludeEdgesEl, dedupeEl]) {
  el.addEventListener('change', () => {
    if (lastRunInput !== null) calculate({ scroll: false });
  });
}

clearBtn.addEventListener('click', () => {
  if (undoSnapshot) {
    const { text, hadResult } = undoSnapshot;
    setUndo(null);
    inputEl.value = text;
    updateInputCount();
    if (hadResult) calculate({ scroll: false });
    else statusEl.textContent = '';
    inputEl.focus();
    return;
  }
  const snapshot = { text: inputEl.value, hadResult: lastRunInput !== null };
  inputEl.value = '';
  lastRunInput = null;
  setOutput([]);
  updateStale();
  updateInputCount();
  if (snapshot.text) {
    setUndo(snapshot);
    statusEl.textContent = '입력을 지웠습니다. "되돌리기"를 누르면 복구됩니다.';
  } else {
    statusEl.textContent = '';
  }
  inputEl.focus();
});

copyBtn.addEventListener('click', () => {
  if (outputEl.value) copyWithFeedback(copyBtn, outputEl.value, 'IP ' + outputCountEl.textContent);
});

downloadBtn.addEventListener('click', () => {
  if (outputEl.value) downloadWithFeedback(downloadBtn, outputEl.value, 'ip-list.txt');
});

updateInputCount();
</script>

</body>
</html>
