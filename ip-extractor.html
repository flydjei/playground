<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="텍스트에 섞인 IPv4 주소만 골라내는 추출기">
<title>IP 추출기</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --fg: #1c1c1e;
    --card: #ffffff;
    --border: #d9dbe0;
    --muted: #555;
    --heading: #444;
    --field-bg: #ffffff;
    --field-ro-bg: #fafafa;
    --field-border: #ccc;
    --accent: #2f62e0;
    --accent-hover: #2552c4;
    --focus: #2f62e0;
    --accent-disabled: #b7c2d9;
    --secondary-bg: #e7e9ee;
    --secondary-hover: #d9dce3;
    --secondary-fg: #1c1c1e;
    --success: #1e8449;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --fg: #e6e6e6;
      --card: #2a2b2e;
      --border: #3a3b3e;
      --muted: #aaa;
      --heading: #bbb;
      --field-bg: #1e1f22;
      --field-ro-bg: #232427;
      --field-border: #444;
      --focus: #7ea2ff;
      --accent-disabled: #3d4658;
      --secondary-bg: #3a3b3e;
      --secondary-hover: #46474b;
      --secondary-fg: #e6e6e6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    margin: 0;
    padding: 24px;
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
    background: var(--bg);
    color: var(--fg);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }
  .desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .container {
    display: flex;
    gap: 20px;
    height: 65vh;
    min-height: 420px;
  }
  .column {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .column-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px;
  }
  .column h2 {
    font-size: 14px;
    margin: 0;
    color: var(--heading);
    font-weight: 600;
  }
  .count {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 10px;
    background: var(--field-bg);
    color: var(--fg);
    border: 1px solid var(--field-border);
    border-radius: 6px;
  }
  textarea:focus { border-color: var(--focus); }
  textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  textarea[readonly] { background: var(--field-ro-bg); }
  textarea.stale { opacity: .55; }
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-top: 10px;
    font-size: 13px;
  }
  .options label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    min-height: 28px;
  }
  .options label.disabled { opacity: .5; cursor: not-allowed; }
  .options input { margin: 0; width: 16px; height: 16px; }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    flex: 1;
    min-height: 40px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    touch-action: manipulation;
  }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { background: var(--accent-disabled); cursor: not-allowed; }
  button.secondary {
    flex: 0 0 auto;
    background: var(--secondary-bg);
    color: var(--secondary-fg);
  }
  button.secondary:hover { background: var(--secondary-hover); }
  button.secondary:disabled { opacity: .5; background: var(--secondary-bg); }
  /* .secondary:hover 보다 뒤에 같은 우선순위로 두어, 클릭 직후(호버 상태)에도 피드백 색이 보이게 함 */
  button.copied, button.copied:hover { background: var(--success); color: #fff; }
  button.failed, button.failed:hover { background: var(--danger); color: #fff; }
  .kbd-hint {
    font-size: 11px;
    font-weight: 400;
    opacity: .75;
    margin-left: 4px;
  }
  #status {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    min-height: 18px;
    overflow-wrap: anywhere;
  }

  @media (max-width: 720px) {
    body {
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    h1 { font-size: 18px; }
    .container {
      flex-direction: column;
      height: auto;
      min-height: 0;
      gap: 14px;
    }
    .column { padding: 14px; }
    #input { height: 30vh; min-height: 160px; flex: none; }
    #output { height: 45vh; min-height: 220px; flex: none; }
    /* iOS Safari 는 16px 미만 입력창 포커스 시 자동 확대되므로 16px 로 고정 */
    textarea { font-size: 16px; }
    button { min-height: 44px; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>

<h1>IP 추출기</h1>
<p class="desc">
  텍스트에 섞여 있는 IPv4 주소만 골라냅니다.
  기본은 입력과 같은 줄 번호를 유지해(IP가 없는 줄은 빈 줄) 스프레드시트 열에 그대로 붙여넣을 수 있습니다.
</p>

<div class="container">
  <div class="column">
    <div class="column-head">
      <h2><label for="input">원본 데이터 입력</label></h2>
      <span class="count" id="inputCount">0줄</span>
    </div>
    <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
      placeholder="1.234.78.200_순수관제&#10;192.168.0.2_텍스트&#10;텍스트으으으&#10;서버 10.0.0.1, 10.0.0.2 점검"></textarea>
    <div class="options">
      <label><input type="checkbox" id="collectMode"> IP만 모아보기 (한 줄의 여러 IP 모두 추출)</label>
      <label class="disabled"><input type="checkbox" id="dedupe" disabled> 중복 제거</label>
      <label class="disabled"><input type="checkbox" id="sortIps" disabled> 정렬</label>
      <label><input type="checkbox" id="keepCidr"> CIDR 표기(/24) 유지</label>
    </div>
    <div class="actions">
      <button id="extractBtn" type="button">IP 추출<span class="kbd-hint">Ctrl+Enter</span></button>
      <button id="clearBtn" type="button" class="secondary">지우기</button>
    </div>
  </div>

  <div class="column">
    <div class="column-head">
      <h2><label for="output">추출된 IP 목록</label></h2>
      <span class="count" id="outputCount">0개</span>
    </div>
    <textarea id="output" readonly spellcheck="false" placeholder="추출 결과가 여기에 표시됩니다."></textarea>
    <div class="actions">
      <button id="copyBtn" type="button" disabled>복사</button>
      <button id="downloadBtn" type="button" class="secondary" disabled>.txt 저장</button>
    </div>
  </div>
</div>

<div id="status" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const inputEl = $('input');
const outputEl = $('output');
const statusEl = $('status');
const extractBtn = $('extractBtn');
const clearBtn = $('clearBtn');
const copyBtn = $('copyBtn');
const downloadBtn = $('downloadBtn');
const collectModeEl = $('collectMode');
const keepCidrEl = $('keepCidr');
const inputCountEl = $('inputCount');
const outputCountEl = $('outputCount');

// 앞뒤가 숫자/점으로 이어지지 않는 "a.b.c.d" 형태 (문장 끝 마침표 "1.2.3.4." 는 허용)
// 뒤에 선택적으로 "/prefix" 가 붙을 수 있음
// lookbehind 는 Safari 16.4 미만에서 문법 오류가 나므로, 앞 글자를 직접 소비하는 방식으로 검사
const IP_RE = /(^|[^\d.])(\d{1,3}(?:\.\d{1,3}){3})(?:\/(\d{1,2}))?(?!\d|\.\d)/g;

// 한 줄에서 유효한 IPv4 주소를 모두 찾아 { text, badPrefix } 배열로 반환
// 옥텟의 앞자리 0 은 제거해 정규화 (010.001.001.001 → 10.1.1.1)
function extractIps(line, keepCidr) {
  const result = [];
  for (const m of line.matchAll(IP_RE)) {
    const octets = m[2].split('.').map(Number);
    if (octets.some(n => n > 255)) continue;
    const ip = octets.join('.');
    const hasPrefix = keepCidr && m[3] !== undefined;
    const validPrefix = hasPrefix && Number(m[3]) <= 32;
    result.push({
      text: validPrefix ? `${ip}/${Number(m[3])}` : ip,
      badPrefix: hasPrefix && !validPrefix,
    });
  }
  return result;
}

function ipSortKey(s) {
  const [ip, prefix = '32'] = s.split('/');
  const n = ip.split('.').reduce((acc, p) => acc * 256 + Number(p), 0);
  return n * 64 + Number(prefix);
}

function fmt(n) { return n.toLocaleString(); }

// 맨 끝의 줄바꿈 하나는 "마지막 줄의 끝"으로 보고 빈 줄로 세지 않음
function splitLines(text) {
  if (text === '') return [];
  const lines = text.split(/\r\n|\r|\n/);
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

// 입력할 때마다 호출되므로 배열을 만들지 않고 줄바꿈 개수만 셈 (textarea 값은 항상 \n 으로 정규화됨)
function countLines(text) {
  if (text === '') return 0;
  let n = 1;
  for (let i = text.indexOf('\n'); i !== -1; i = text.indexOf('\n', i + 1)) n++;
  if (n > 1 && text.endsWith('\n')) n--;
  return n;
}

function updateInputCount() {
  inputCountEl.textContent = `${fmt(countLines(inputEl.value))}줄`;
}

// "중복 제거", "정렬"은 모아보기 모드에서만 동작하므로, 꺼져 있을 때는 비활성 + 체크 해제로 표시
// 모아보기를 다시 켜면 사용자가 마지막으로 고른 값(처음엔 체크)을 복원
const collectOnlyOptions = [
  { el: $('dedupe'), preference: true },
  { el: $('sortIps'), preference: true },
];
const [dedupeOpt, sortOpt] = collectOnlyOptions;

function syncOptions() {
  const collect = collectModeEl.checked;
  for (const opt of collectOnlyOptions) {
    opt.el.disabled = !collect;
    opt.el.checked = collect && opt.preference;
    opt.el.closest('label').classList.toggle('disabled', !collect);
  }
}

let hasResult = false;   // 현재 결과창이 추출 결과를 보여주는 중인지
let undoSnapshot = null; // "지우기" 직전 상태 (되돌리기용)

function setOutput(text, ipCount) {
  outputEl.value = text;
  outputEl.classList.remove('stale');
  outputCountEl.textContent = `${fmt(ipCount)}개`;
  copyBtn.disabled = downloadBtn.disabled = ipCount === 0;
}

function setUndo(snapshot) {
  undoSnapshot = snapshot;
  clearBtn.textContent = snapshot ? '되돌리기' : '지우기';
}

function extract({ scroll = true } = {}) {
  const lines = splitLines(inputEl.value);
  const perLine = lines.map(line => extractIps(line, keepCidrEl.checked));
  hasResult = lines.length > 0;

  let summary;
  let used; // 실제로 결과에 쓰인 항목
  if (collectModeEl.checked) {
    used = perLine.flat();
    let ips = used.map(item => item.text);
    const found = ips.length;
    if (dedupeOpt.el.checked) ips = Array.from(new Set(ips));
    if (sortOpt.el.checked) ips.sort((a, b) => ipSortKey(a) - ipSortKey(b));
    setOutput(ips.join('\n'), ips.length);
    summary = `총 ${fmt(lines.length)}줄에서 IP ${fmt(found)}개를 찾았습니다.`;
    if (found !== ips.length) summary += ` (중복 ${fmt(found - ips.length)}개 제거)`;
  } else {
    // 각 줄의 첫 번째 IP만 남기고 나머지는 빈 줄 처리 (행 번호는 그대로 유지)
    used = perLine.filter(ips => ips.length).map(ips => ips[0]);
    const multiLines = perLine.filter(ips => ips.length > 1).length;
    // IP가 하나도 없으면 줄바꿈만 채우지 않고 결과를 비움
    setOutput(used.length ? perLine.map(ips => (ips[0] ? ips[0].text : '')).join('\n') : '', used.length);
    summary = `총 ${fmt(lines.length)}줄 중 ${fmt(used.length)}개 줄에서 IP를 추출했습니다.`;
    if (multiLines) summary += ` IP가 2개 이상인 줄 ${fmt(multiLines)}개는 첫 번째 IP만 사용했습니다. 모두 필요하면 "IP만 모아보기"를 켜세요.`;
  }
  const badPrefixes = used.filter(item => item.badPrefix).length;
  if (badPrefixes) summary += ` 범위를 벗어난 CIDR 표기(/33 이상) ${fmt(badPrefixes)}개는 무시하고 IP만 남겼습니다.`;
  if (!used.length) summary = `총 ${fmt(lines.length)}줄에서 IP를 찾지 못했습니다.`;
  if (!lines.length) summary = '입력된 데이터가 없습니다.';
  statusEl.textContent = summary;

  // 모바일(세로 배치)에서는 결과 영역이 화면 아래에 있으므로 자동으로 스크롤
  if (scroll && window.matchMedia('(max-width: 720px)').matches) {
    outputEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function flash(btn, text, className = 'copied') {
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = text;
  btn.classList.remove('copied', 'failed');
  btn.classList.add(className);
  clearTimeout(btn._timer);
  btn._timer = setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove(className);
  }, 1200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    // 권한 거부·비보안 컨텍스트 등: 아래 구형 방식으로 재시도
  }
  try {
    outputEl.removeAttribute('readonly');
    outputEl.select();
    return document.execCommand('copy');
  } catch (err) {
    return false;
  } finally {
    outputEl.setAttribute('readonly', '');
    window.getSelection()?.removeAllRanges();
  }
}

// 옵션을 바꾸면 이미 표시된 결과도 새 설정으로 다시 계산 (결과와 설정이 어긋나지 않도록)
function onOptionChange() {
  if (hasResult) extract({ scroll: false });
}

extractBtn.addEventListener('click', () => extract());
collectModeEl.addEventListener('change', () => { syncOptions(); onOptionChange(); });
keepCidrEl.addEventListener('change', onOptionChange);
for (const opt of collectOnlyOptions) {
  opt.el.addEventListener('change', () => { opt.preference = opt.el.checked; onOptionChange(); });
}

inputEl.addEventListener('input', () => {
  updateInputCount();
  if (undoSnapshot) setUndo(null);
  // 추출 후 입력이 바뀌면 결과가 더 이상 최신이 아님을 표시
  if (hasResult && !outputEl.classList.contains('stale')) {
    outputEl.classList.add('stale');
    statusEl.textContent = '입력이 변경되었습니다. 아래 결과는 변경 전 내용이니 다시 추출하세요.';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
    e.preventDefault();
    extract();
  }
});

clearBtn.addEventListener('click', () => {
  if (undoSnapshot) {
    const { text, hadResult } = undoSnapshot;
    setUndo(null);
    inputEl.value = text;
    updateInputCount();
    if (hadResult) extract({ scroll: false });
    else statusEl.textContent = '';
    inputEl.focus();
    return;
  }
  const snapshot = { text: inputEl.value, hadResult: hasResult };
  inputEl.value = '';
  hasResult = false;
  setOutput('', 0);
  updateInputCount();
  if (snapshot.text) {
    setUndo(snapshot);
    statusEl.textContent = '입력을 지웠습니다. "되돌리기"를 누르면 복구됩니다.';
  } else {
    statusEl.textContent = '';
  }
  inputEl.focus();
});

copyBtn.addEventListener('click', async () => {
  if (!outputEl.value) return;
  if (await copyText(outputEl.value)) {
    flash(copyBtn, '복사됨!');
  } else {
    flash(copyBtn, '복사 실패', 'failed');
    statusEl.textContent = '클립보드에 복사하지 못했습니다. 결과를 직접 선택해 복사하거나 ".txt 저장"을 이용하세요.';
  }
});

downloadBtn.addEventListener('click', () => {
  if (!outputEl.value) return;
  const blob = new Blob([outputEl.value + '\n'], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'extracted-ips.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash(downloadBtn, '저장됨!');
});

syncOptions();
updateInputCount();
</script>

</body>
</html>
